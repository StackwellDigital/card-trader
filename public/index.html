<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Trader</title>
<style>
:root {
  --ink: #12131a;
  --panel: #1c1e29;
  --panel-2: #262939;
  --foil-1: #6ee7d4;
  --foil-2: #a78bfa;
  --foil-3: #fbbf24;
  --text: #eef0f7;
  --muted: #9298b0;
  --danger: #f87171;
  --good: #4ade80;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Trebuchet MS', system-ui, sans-serif; letter-spacing: -0.02em; }
.foil-text {
  background: linear-gradient(100deg, var(--foil-1), var(--foil-2) 50%, var(--foil-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #2a2d3d;
  position: sticky; top: 0;
  background: rgba(18,19,26,0.9);
  backdrop-filter: blur(6px);
  z-index: 10;
}
header h1 { font-size: 1.3rem; margin: 0; }
#whoami { color: var(--muted); font-size: 0.85rem; }
main { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
.card-panel {
  background: var(--panel);
  border: 1px solid #2a2d3d;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
input, select, button {
  font-size: 1rem;
  border-radius: 10px;
  border: 1px solid #34374a;
  padding: 10px 12px;
  background: var(--panel-2);
  color: var(--text);
}
input, select { width: 100%; margin-bottom: 8px; }
button {
  cursor: pointer;
  border: none;
  background: linear-gradient(100deg, var(--foil-1), var(--foil-2));
  color: #12131a;
  font-weight: 700;
}
button.secondary {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid #34374a;
}
button.danger { background: var(--danger); color: #12131a; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--panel);
  border-top: 1px solid #2a2d3d;
  display: flex;
  z-index: 10;
}
nav.tabs button {
  flex: 1; background: none; color: var(--muted);
  border-radius: 0; padding: 14px 0; font-weight: 600;
}
nav.tabs button.active { color: var(--foil-1); }
.tile {
  background: var(--panel-2);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-left: 3px solid var(--foil-1);
  gap: 10px;
}
.tile.wants { border-left-color: var(--foil-3); }
.tile .meta { color: var(--muted); font-size: 0.85rem; }
.tile .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tile .thumb {
  width: 40px;
  height: 56px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
  background: #12131a;
}
.tile .info { min-width: 0; }
.tile .info strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: #34374a;
  color: var(--muted);
  white-space: nowrap;
}
.screen { display: none; }
.screen.active { display: block; }
#camPreview { width: 100%; border-radius: 10px; margin-bottom: 8px; display: none; }
.hint { color: var(--muted); font-size: 0.85rem; }
.selected-preview {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.selected-preview img {
  width: 50px;
  height: 70px;
  object-fit: cover;
  border-radius: 6px;
}
.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  margin-top: 8px;
}
.result-card {
  background: var(--panel-2);
  border: 1px solid #34374a;
  border-radius: 12px;
  padding: 8px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, transform 0.15s;
}
.result-card:hover {
  border-color: var(--foil-1);
  transform: translateY(-2px);
}
.result-card img {
  width: 100%;
  aspect-ratio: 5 / 7;
  object-fit: cover;
  border-radius: 8px;
  background: #12131a;
  margin-bottom: 6px;
}
.result-card .rc-name {
  font-size: 0.82rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-card .rc-meta {
  color: var(--muted);
  font-size: 0.72rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-card .rc-price {
  margin-top: 4px;
  display: inline-block;
}
</style>
</head>
<body>

<header>
  <h1>🃏 Card <span class="foil-text">Trader</span></h1>
  <div id="whoami"></div>
</header>

<main>

<!-- LOGIN -->
<section id="screen-login" class="screen active">
  <div class="card-panel">
    <h2>Sign in</h2>
    <input id="li-username" placeholder="Username">
    <input id="li-pin" placeholder="4-digit PIN" type="password" inputmode="numeric">
    <div class="row">
      <button onclick="login()">Sign in</button>
      <button class="secondary" onclick="signup()">Create account</button>
    </div>
    <p id="login-error" class="hint" style="color:var(--danger)"></p>
  </div>
</section>

<!-- COLLECTION -->
<section id="screen-collection" class="screen">
  <div class="card-panel" id="value-banner">
    <h2>Collection value <span class="foil-text" id="total-value">$0.00</span></h2>
    <div id="value-breakdown" class="hint"></div>
  </div>

  <div class="card-panel">
    <h2>Add a card</h2>
    <div class="row">
      <select id="add-category" onchange="onCategoryChange()">
        <option value="pokemon">Pokemon</option>
        <option value="magic">Magic: The Gathering</option>
        <option value="sports">Sports</option>
      </select>
      <select id="add-wants">
        <option value="0">I have it</option>
        <option value="1">I want it</option>
      </select>
    </div>

    <!-- Pokemon / Magic: search by name -->
    <div id="lookup-block">
      <div class="row">
        <input id="lookup-name" placeholder="Search card name...">
        <button onclick="searchCard()">Search</button>
      </div>
      <div id="lookup-results"></div>
    </div>

    <!-- Sports: manual entry -->
    <div id="sports-block" style="display:none">
      <select id="sports-manufacturer">
        <option value="Topps">Topps</option>
        <option value="Upper Deck">Upper Deck</option>
        <option value="Panini">Panini</option>
        <option value="O-Pee-Chee">O-Pee-Chee</option>
        <option value="Other">Other</option>
      </select>
      <input id="sports-year" placeholder="Year (e.g. 2023)">
      <input id="sports-player" placeholder="Player name">
      <input id="sports-set" placeholder="Set / insert name (optional)">
      <input id="sports-number" placeholder="Card # (optional)">
    </div>

    <!-- shared fields, autofilled by search or typed for sports -->
    <input id="add-name" placeholder="Card name" style="display:none">
    <input id="add-set" placeholder="Set" style="display:none">
    <input id="add-number" placeholder="Card #" style="display:none">
    <input id="add-image" type="hidden">
    <input id="add-value" placeholder="Estimated value (USD)" type="number" step="0.01">
    <button onclick="addCard()">Add to collection</button>
  </div>

  <div class="card-panel">
    <h2>My cards</h2>
    <div id="my-cards"></div>
  </div>
</section>

<!-- FRIENDS -->
<section id="screen-friends" class="screen">
  <div class="card-panel">
    <h2>Add a friend</h2>
    <div class="row">
      <input id="friend-username" placeholder="Friend's username">
      <button onclick="addFriend()">Add</button>
    </div>
  </div>
  <div class="card-panel">
    <h2>Friends</h2>
    <div id="friends-list"></div>
  </div>
</section>

<!-- TRADES -->
<section id="screen-trades" class="screen">
  <div class="card-panel">
    <h2>Trade matches</h2>
    <p class="hint">Pick a friend to see what you can trade.</p>
    <select id="match-friend" onchange="showMatches()"></select>
    <div id="matches"></div>
  </div>
  <div class="card-panel">
    <h2>My trade offers</h2>
    <div id="trades-list"></div>
  </div>
</section>

</main>

<nav class="tabs" id="tabs" style="display:none">
  <button onclick="showScreen('collection')" data-tab="collection">Collection</button>
  <button onclick="showScreen('friends')" data-tab="friends">Friends</button>
  <button onclick="showScreen('trades')" data-tab="trades">Trades</button>
  <button class="secondary" onclick="logout()">Log out</button>
</nav>

<script>
const API = '/api';
let me = JSON.parse(localStorage.getItem('cardtrader_me') || 'null');
let friendsCache = [];

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  if (name === 'collection') loadCards();
  if (name === 'friends') loadFriends();
  if (name === 'trades') { loadFriendSelect(); loadTrades(); }
}

async function api(path, opts) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) throw new Error((await res.json()).error || 'request failed');
  return res.json();
}

async function signup() {
  const username = document.getElementById('li-username').value.trim();
  const pin = document.getElementById('li-pin').value.trim();
  try {
    me = await api('/signup', { method: 'POST', body: JSON.stringify({ username, pin }) });
    finishLogin();
  } catch (e) { document.getElementById('login-error').textContent = e.message; }
}

async function login() {
  const username = document.getElementById('li-username').value.trim();
  const pin = document.getElementById('li-pin').value.trim();
  try {
    me = await api('/login', { method: 'POST', body: JSON.stringify({ username, pin }) });
    finishLogin();
  } catch (e) { document.getElementById('login-error').textContent = e.message; }
}

function finishLogin() {
  localStorage.setItem('cardtrader_me', JSON.stringify(me));
  document.getElementById('whoami').textContent = me.username;
  document.getElementById('tabs').style.display = 'flex';
  showScreen('collection');
}

function logout() {
  localStorage.removeItem('cardtrader_me');
  location.reload();
}

// ---------- collection ----------
function onCategoryChange() {
  const cat = document.getElementById('add-category').value;
  document.getElementById('lookup-block').style.display = cat === 'sports' ? 'none' : 'block';
  document.getElementById('sports-block').style.display = cat === 'sports' ? 'block' : 'none';
  document.getElementById('lookup-results').innerHTML = '';
  clearAddFields();
}

function clearAddFields() {
  document.getElementById('add-name').value = '';
  document.getElementById('add-set').value = '';
  document.getElementById('add-number').value = '';
  document.getElementById('add-image').value = '';
  document.getElementById('add-value').value = '';
}

async function searchCard() {
  const cat = document.getElementById('add-category').value;
  const name = document.getElementById('lookup-name').value.trim();
  const resultsEl = document.getElementById('lookup-results');
  if (!name) return;
  resultsEl.innerHTML = '<p class="hint">Searching...</p>';
  try {
    const results = await api(`/lookup/${cat}?name=${encodeURIComponent(name)}`);
    if (!results.length) { resultsEl.innerHTML = '<p class="hint">No matches, try a different spelling.</p>'; return; }
    const grid = document.createElement('div');
    grid.className = 'result-grid';
    results.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'result-card';
      div.onclick = () => pickResult(r);
      div.innerHTML = `
        ${r.image_url ? `<img src="${r.image_url}" alt="${r.name}" loading="lazy">` : ''}
        <div class="rc-name">${r.name}</div>
        <div class="rc-meta">${r.set_name || ''} ${r.card_number ? '#' + r.card_number : ''}</div>
        <span class="badge rc-price">${r.value_usd != null ? '$' + Number(r.value_usd).toFixed(2) : 'no price'}</span>`;
      grid.appendChild(div);
    });
    resultsEl.innerHTML = '';
    resultsEl.appendChild(grid);
  } catch (e) {
    resultsEl.innerHTML = `<p class="hint">Lookup failed: ${e.message}</p>`;
  }
}

function pickResult(r) {
  document.getElementById('add-name').value = r.name;
  document.getElementById('add-set').value = r.set_name || '';
  document.getElementById('add-number').value = r.card_number || '';
  document.getElementById('add-image').value = r.image_url || '';
  document.getElementById('add-value').value = r.value_usd != null ? r.value_usd : '';
  document.getElementById('lookup-results').innerHTML = `
    <div class="selected-preview">
      ${r.image_url ? `<img src="${r.image_url}" alt="${r.name}">` : ''}
      <p class="hint" style="margin:0">Selected: ${r.name} — check the value field, then hit Add.</p>
    </div>`;
}

async function loadCards() {
  const cards = await api('/cards/' + me.id);
  const el = document.getElementById('my-cards');
  el.innerHTML = cards.length ? '' : '<p class="hint">No cards yet — add one above.</p>';
  cards.forEach(c => {
    const div = document.createElement('div');
    div.className = 'tile' + (c.wants ? ' wants' : '');
    const sub = c.category === 'sports'
      ? `${c.manufacturer || ''} ${c.year || ''} ${c.set_name || ''}`.trim()
      : `${c.set_name || ''} ${c.card_number ? '#' + c.card_number : ''}`.trim();
    div.innerHTML = `<div class="left">
        ${c.image_url ? `<img class="thumb" src="${c.image_url}" alt="${c.name}" loading="lazy">` : ''}
        <div class="info">
          <strong>${c.name}</strong> <span class="badge">${c.category}</span>
          <div class="meta">${sub}</div>
        </div>
      </div>
      <div>
        <span class="badge">${c.wants ? 'wants' : (c.value_usd != null ? '$' + Number(c.value_usd).toFixed(2) : 'no price')}</span>
        ${!c.wants && c.category !== 'sports' ? `<button class="secondary" onclick="refreshPrice(${c.id})">↻</button>` : ''}
        <button class="secondary" onclick="deleteCard(${c.id})">✕</button>
      </div>`;
    el.appendChild(div);
  });
  loadCollectionValue();
}

async function loadCollectionValue() {
  const { total, by_category } = await api('/collection-value/' + me.id);
  document.getElementById('total-value').textContent = '$' + Number(total).toFixed(2);
  document.getElementById('value-breakdown').textContent = by_category
    .map(c => `${c.category}: $${Number(c.subtotal).toFixed(2)} (${c.card_count} cards)`)
    .join(' · ');
}

async function refreshPrice(id) {
  try {
    await api(`/cards/${id}/refresh-price`, { method: 'POST' });
    loadCards();
  } catch (e) { alert('Could not find a current price for that card.'); }
}

async function addCard() {
  const category = document.getElementById('add-category').value;
  let body;
  if (category === 'sports') {
    body = {
      user_id: me.id,
      category,
      wants: document.getElementById('add-wants').value === '1',
      name: document.getElementById('sports-player').value.trim(),
      set_name: document.getElementById('sports-set').value.trim(),
      card_number: document.getElementById('sports-number').value.trim(),
      manufacturer: document.getElementById('sports-manufacturer').value,
      year: document.getElementById('sports-year').value.trim(),
      value_usd: document.getElementById('add-value').value || null,
      quantity: 1,
    };
  } else {
    body = {
      user_id: me.id,
      category,
      wants: document.getElementById('add-wants').value === '1',
      name: document.getElementById('add-name').value.trim(),
      set_name: document.getElementById('add-set').value.trim(),
      card_number: document.getElementById('add-number').value.trim(),
      image_url: document.getElementById('add-image').value || null,
      value_usd: document.getElementById('add-value').value || null,
      quantity: 1,
    };
  }
  if (!body.name) return;
  await api('/cards', { method: 'POST', body: JSON.stringify(body) });
  clearAddFields();
  document.getElementById('lookup-name').value = '';
  document.getElementById('lookup-results').innerHTML = '';
  ['sports-year','sports-player','sports-set','sports-number'].forEach(id => {
    const elm = document.getElementById(id);
    if (elm) elm.value = '';
  });
  loadCards();
}

async function deleteCard(id) {
  await api('/cards/' + id, { method: 'DELETE' });
  loadCards();
}

// ---------- friends ----------
async function loadFriends() {
  friendsCache = await api('/friends/' + me.id);
  const el = document.getElementById('friends-list');
  el.innerHTML = friendsCache.length ? '' : '<p class="hint">No friends added yet.</p>';
  friendsCache.forEach(f => {
    const div = document.createElement('div');
    div.className = 'tile';
    div.innerHTML = `<strong>${f.username}</strong>`;
    el.appendChild(div);
  });
}

async function addFriend() {
  const friend_username = document.getElementById('friend-username').value.trim();
  if (!friend_username) return;
  try {
    await api('/friends', { method: 'POST', body: JSON.stringify({ user_id: me.id, friend_username }) });
    document.getElementById('friend-username').value = '';
    loadFriends();
  } catch (e) { alert(e.message); }
}

// ---------- trades ----------
async function loadFriendSelect() {
  friendsCache = await api('/friends/' + me.id);
  const sel = document.getElementById('match-friend');
  sel.innerHTML = '<option value="">Choose a friend...</option>' +
    friendsCache.map(f => `<option value="${f.id}">${f.username}</option>`).join('');
}

async function showMatches() {
  const friendId = document.getElementById('match-friend').value;
  const el = document.getElementById('matches');
  if (!friendId) { el.innerHTML = ''; return; }
  const { i_can_give, they_can_give } = await api(`/matches/${me.id}/${friendId}`);
  el.innerHTML = '<h3>You could offer</h3>';
  el.innerHTML += i_can_give.length
    ? i_can_give.map(c => tradeTile(c, friendId, 'offer')).join('')
    : '<p class="hint">Nothing matches yet.</p>';
  el.innerHTML += '<h3>They could offer you</h3>';
  el.innerHTML += they_can_give.length
    ? they_can_give.map(c => `<div class="tile"><strong>${c.name}</strong> <span class="badge">${c.set_name || ''}</span></div>`).join('')
    : '<p class="hint">Nothing matches yet.</p>';
}

function tradeTile(card, friendId) {
  return `<div class="tile">
    <div><strong>${card.name}</strong> <span class="badge">${card.set_name || ''}</span></div>
    <button onclick="proposeTrade(${friendId}, ${card.id})">Propose</button>
  </div>`;
}

async function proposeTrade(friendId, offerCardId) {
  await api('/trades', {
    method: 'POST',
    body: JSON.stringify({ from_user: me.id, to_user: friendId, offer_card_id: offerCardId, request_card_id: offerCardId }),
  });
  alert('Trade proposed!');
  loadTrades();
}

async function loadTrades() {
  const trades = await api('/trades/' + me.id);
  const el = document.getElementById('trades-list');
  el.innerHTML = trades.length ? '' : '<p class="hint">No trades yet.</p>';
  trades.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tile';
    const iAmReceiver = t.to_user === me.id && t.status === 'pending';
    div.innerHTML = `<div>Trade #${t.id} <span class="badge">${t.status}</span></div>
      ${iAmReceiver ? `<div class="row">
        <button onclick="respondTrade(${t.id}, 'accepted')">Accept</button>
        <button class="danger" onclick="respondTrade(${t.id}, 'declined')">Decline</button>
      </div>` : ''}`;
    el.appendChild(div);
  });
}

async function respondTrade(id, status) {
  await api(`/trades/${id}/respond`, { method: 'POST', body: JSON.stringify({ status }) });
  loadTrades();
}

// ---------- boot ----------
if (me) finishLogin();
</script>
</body>
</html>
